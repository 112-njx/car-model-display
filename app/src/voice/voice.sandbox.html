<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080d12" />
    <title>T6 语音控车 · 自测沙盒</title>
    <!--
      T6 独立自测页（roadmap §11.1 T6 第⑤条）。
      入口：Vite dev server 直接服务本文件 —— http://localhost:5173/src/voice/voice.sandbox.html
      注意：不参与 npm run build（T6 无权改 vite.config.js 的 rollupOptions.input，见《挂载说明》）。
      本页不 import 主应用的任何模块（store/App/场景），因此不会影响主入口。
    -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #080d12;
        --panel: rgba(14, 24, 33, 0.78);
        --border: rgba(120, 200, 220, 0.2);
        --text: #e9f5f9;
        --dim: rgba(233, 245, 249, 0.6);
        --accent: #4fd8e8;
        --ok: #5fd39a;
        --warn: #ffc46b;
        --bad: #ff8181;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px clamp(12px, 3vw, 32px) 48px;
        background:
          radial-gradient(120% 90% at 12% -10%, rgba(79, 216, 232, 0.12), transparent 58%),
          radial-gradient(90% 70% at 100% 0%, rgba(79, 140, 232, 0.1), transparent 55%),
          var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        min-height: 100vh;
      }
      h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: 0.02em; }
      h2 { margin: 0 0 10px; font-size: 14px; letter-spacing: 0.06em; color: var(--accent); text-transform: uppercase; }
      .sub { margin: 0 0 18px; font-size: 12.5px; color: var(--dim); line-height: 1.6; }
      .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-items: start; }
      .card {
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--panel);
        backdrop-filter: blur(12px);
      }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
      button.tool {
        padding: 7px 12px; border: 1px solid var(--border); border-radius: 999px;
        background: transparent; color: var(--text); font: inherit; font-size: 12px; cursor: pointer;
      }
      button.tool:hover { border-color: var(--accent); color: var(--accent); }
      button.tool[aria-pressed="true"] { background: rgba(79, 216, 232, 0.16); border-color: var(--accent); color: var(--accent); }
      .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 12.5px; }
      .kv dt { color: var(--dim); }
      .kv dd { margin: 0; overflow-wrap: anywhere; }
      .ok { color: var(--ok); }
      .warn { color: var(--warn); }
      .bad { color: var(--bad); }
      .log {
        max-height: 260px; overflow: auto; margin: 0; padding: 10px 12px;
        border-radius: 12px; background: rgba(0, 0, 0, 0.34);
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11.5px;
        line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere;
      }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip {
        padding: 4px 9px; border: 1px solid var(--border); border-radius: 999px;
        font-size: 11.5px; color: var(--dim);
      }
      .chip--open { color: var(--accent); border-color: rgba(79, 216, 232, 0.45); background: rgba(79, 216, 232, 0.12); }
      .chip--on { color: var(--warn); border-color: rgba(255, 196, 107, 0.45); background: rgba(255, 196, 107, 0.12); }
      table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
      th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid rgba(120, 200, 220, 0.12); }
      th { color: var(--dim); font-weight: 600; }
      td.mono { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; overflow-wrap: anywhere; }
      .summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; font-size: 12.5px; }
      details { margin-top: 10px; }
      summary { cursor: pointer; color: var(--dim); font-size: 12.5px; }
    </style>
  </head>
  <body>
    <h1>T6 语音控车 · 自测沙盒</h1>
    <p class="sub">
      独立自测页，不挂载主应用、不读写 store。<br />
      链路：SpeechRecognition（可注入 mock）→ <code>parseAlternatives</code> → <code>executePlan</code> → 右侧「假车状态」。<br />
      真机麦克风识别请在 <strong>https 或 localhost</strong> 的 Chrome / Edge 中点击麦克风测试。
    </p>
    <div id="cd-voice-sandbox-root"></div>
    <script type="module" src="./sandbox.jsx"></script>
  </body>
</html>
