<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1017" />
    <meta name="description" content="新能源中控大屏风格的 3D 车模展示与交互 Demo：拖动旋转、点按车身部件开合、中文语音控车。" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <style>
      /* T4：静态首屏（React 挂载前的第一帧）。文案与配色与 ui/LoadingScreen 保持一致，
         避免出现「中文加载页接英文 boot 页」的割裂。原先的 localStorage 跳过逻辑已移除。 */
      html,body{margin:0;background:#0d1017;color:#eef3f7}
      .loading-screen--boot{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;box-sizing:border-box;padding:clamp(1.25rem,5vw,4rem);background:#0d1017;font-family:ui-monospace,monospace}
      .loading-screen--boot .loading-header,.loading-screen--boot .loading-status,.loading-screen--boot .loading-meta{display:flex;justify-content:space-between;gap:1rem;font-size:.7rem;letter-spacing:.14em}
      .loading-screen--boot .loading-header{align-items:flex-start}
      .loading-screen--boot .loading-hero{align-self:center}
      .loading-screen--boot .loading-hero span{color:#6fe3ea;font-size:.65rem;letter-spacing:.2em}
      .loading-screen--boot .loading-hero p{margin:.6rem 0 0;font:600 clamp(2.6rem,9vw,5.5rem)/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.06em}
      .loading-screen--boot .loading-rule{height:1px;margin:.85rem 0;background:rgba(238,243,247,.18)}
      .loading-screen--boot .loading-meta{color:rgba(238,243,247,.6);font-size:.6rem;letter-spacing:.1em}
    </style>
    <title>智能座舱 · 3D 车模控制台</title>
  </head>
  <body>
    <div id="root">
      <section class="loading-screen loading-screen--boot" aria-label="车辆模型加载中" aria-busy="true">
        <header class="loading-header"><span>智能座舱</span><span>3D 车模控制台</span></header>
        <div class="loading-hero" aria-hidden="true"><span>正在载入车辆</span><p>车形即现</p></div>
        <div class="loading-telemetry">
          <div class="loading-status"><span>正在准备资源</span><strong>00</strong></div>
          <div class="loading-rule"></div>
          <div class="loading-meta"><span>实时渲染通道</span><span>首次载入约 22 MB</span></div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
